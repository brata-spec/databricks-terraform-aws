name: terraform-apply

# Merge to main  -> apply what changed, DEV targets only (+ account if changed)
# Run workflow   -> pick environment (dev/prod) and team (or all); prod only ever deploys here
#
# Order: account -> workspaces (all targets) -> configs (all targets)
# Two waves so a cross-team share always finds the consumer's workspace.

on:
  push:
    branches: [main]
    paths:
      - "account-level/**"
      - "workspace-level/**"
      - "modules/**"
      - "scripts/**"
      - ".github/workflows/apply.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        type: choice
        options: [dev, prod]
        default: dev
      team:
        description: "Team folder under workspace-level/ (or 'all')"
        type: string
        default: all
      account:
        description: "Also apply account-level (metastore, groups)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # GitHub OIDC -> AWS apply role of the job's environment

# Never run two applies at once; queue instead of cancelling.
concurrency:
  group: terraform-apply
  cancel-in-progress: false

env:
  TF_VERSION: "~1.11.0"
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_databricks_account_id: ${{ vars.DATABRICKS_ACCOUNT_ID }}
  TF_VAR_deployer_client_id: ${{ secrets.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
  DATABRICKS_AUTH_TYPE: oauth-m2m # use the SP secret; don't auto-pick GitHub OIDC

jobs:
  detect:
    name: targets
    runs-on: ubuntu-latest
    outputs:
      account: ${{ steps.c.outputs.account }}
      targets: ${{ steps.c.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: c
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          IN_ENV: ${{ inputs.environment }}
          IN_TEAM: ${{ inputs.team }}
          IN_ACCOUNT: ${{ inputs.account }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == push ]]; then
            bash scripts/changed-targets.sh --base "$BEFORE" --env dev
          else
            out=$(GITHUB_OUTPUT= bash scripts/changed-targets.sh --all --env "$IN_ENV" --team "$IN_TEAM")
            targets=$(grep '^targets=' <<<"$out")
            [[ "$targets" != "targets=[]" ]] || { echo "::error::no workspace-level/$IN_TEAM/$IN_ENV.tfvars"; exit 1; }
            echo "account=$IN_ACCOUNT" >>"$GITHUB_OUTPUT"
            echo "$targets" >>"$GITHUB_OUTPUT"
            echo "account=$IN_ACCOUNT"; echo "$targets"
          fi

  account:
    name: apply account
    needs: detect
    if: needs.detect.outputs.account == 'true'
    runs-on: ubuntu-latest
    environment: dev # account-level uses the dev apply role (state bucket + Databricks SP only)
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: gha-apply-account-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: bash scripts/tf.sh apply account

  workspace:
    name: workspace ${{ matrix.team }}-${{ matrix.env }}
    needs: [detect, account]
    if: >-
      always() &&
      needs.detect.result == 'success' &&
      needs.detect.outputs.targets != '[]' &&
      (needs.account.result == 'success' || needs.account.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ matrix.env }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: gha-apply-${{ matrix.env }}-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: bash scripts/tf.sh apply "${{ matrix.team }}" "${{ matrix.env }}" workspace

  config:
    name: config ${{ matrix.team }}-${{ matrix.env }}
    needs: [detect, workspace]
    if: >-
      always() &&
      needs.detect.outputs.targets != '[]' &&
      needs.workspace.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ matrix.env }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: gha-apply-${{ matrix.env }}-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: bash scripts/tf.sh apply "${{ matrix.team }}" "${{ matrix.env }}" config
